name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession would otherwise race: both jobs recreate the
# 'latest' tag, so whichever finishes last wins, and that is not necessarily the
# newer commit. Keep only the newest run per ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Two jobs.
#
# 'validate' cross-compiles every source file for ARM against the public
# SigmaStar headers and syntax-checks every script, including the ones generated
# into the initramfs.
#
# 'firmware' builds a flashable image and uploads it as a run artifact. It runs
# on every push to master and on manual dispatch, but not on pull requests. The
# proprietary XiongMai modules and /config tables it needs are committed under
# vendor/, the same approach OpenIPC takes with its SigmaStar blobs, so no dump
# and no secret is required.
#
# Publishing the image is safe from a secrets point of view: host keys are
# generated on the board's first boot and kept in flash, so no private key is
# ever baked in. Root's password is the documented default.

jobs:
  validate:
    name: Cross-compile sources
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # libc6-dev-armhf-cross is only a Recommends of the cross compiler, so
      # --no-install-recommends leaves it out and gcc silently falls back to the
      # host /usr/include -- where bits/libc-header-start.h is under
      # x86_64-linux-gnu/ and cannot be found.
      - name: Install ARM cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross busybox-static
          arm-linux-gnueabihf-gcc -print-sysroot || true
          echo '#include <stdio.h>' > /tmp/t.c
          echo 'int main(void){return 0;}' >> /tmp/t.c
          arm-linux-gnueabihf-gcc -o /tmp/t /tmp/t.c
          echo "target libc headers OK"

      # Only the MI headers, not the whole ~2GB SDK.
      - name: Fetch MI headers from the SigmaStar SDK
        uses: actions/checkout@v4
        with:
          repository: wireless-tag-com/openwrt-ssd20x
          path: sdk
          sparse-checkout: |
            18.06/package/sigmastar/sstar-mpp/files/glibc/include
          sparse-checkout-cone-mode: false

      - name: Shell syntax
        run: |
          fail=0
          for s in *.sh; do
            printf '%-20s ' "$s"
            if bash -n "$s"; then echo OK; else echo FAIL; fail=1; fi
          done
          exit $fail

      # bash -n treats a heredoc as data, so the init script and the ten helper
      # scripts it writes are never checked by the step above -- yet they are
      # the ones that can only fail on the board, where there is no shell to
      # debug them from. Extract and check them as BusyBox ash would see them.
      - name: Generated on-target scripts
        run: |
          awk '/^cat > \$INITRAMFS_DIR\/init << .EOF.$/{f=1;next} f && /^EOF$/{exit} f' \
            build-sdk.sh > init.sh
          test -s init.sh || { echo "could not extract the init heredoc"; exit 1; }
          awk "/<< 'INNER'\$/{n++;out=\"inner-\" n \".sh\";f=1;next} \
               f&&/^INNER\$/{f=0;next} f{print > out}" init.sh
          fail=0
          for s in init.sh inner-*.sh; do
            printf '%-16s ' "$s"
            if dash -n "$s" && busybox sh -n "$s"; then echo OK; else echo FAIL; fail=1; fi
          done
          exit $fail

      - name: Cross-compile
        run: |
          INC=sdk/18.06/package/sigmastar/sstar-mpp/files/glibc/include
          test -f "$INC/mi_sys.h" || { echo "MI headers not found in $INC"; exit 1; }
          mkdir -p obj
          # verify-sig.c includes both of these; build-sdk.sh generates the
          # second one from the committed public key.
          python3 -c "import sys; print(','.join('0x%02x' % b for b in open(sys.argv[1],'rb').read()))" \
            signing-key.pub > obj/signing-pubkey.h
          fail=0
          for f in src/*.c; do
            printf '%-24s ' "$f"
            if arm-linux-gnueabihf-gcc -Wall -O2 -c -I"$INC" -Isrc/tweetnacl -Iobj \
                 -o "obj/$(basename "${f%.c}").o" "$f"; then
              echo OK
            else
              echo FAIL; fail=1
            fi
          done
          exit $fail

      - name: Report
        run: |
          ls -l obj/
          arm-linux-gnueabihf-readelf -h obj/mi-player.o | grep -E 'Machine|Class'

  firmware:
    name: Full image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: validate
    # Every push to master, plus manual runs from the Actions tab. Not on pull
    # requests: an image per PR would burn 40 minutes a push for something
    # nobody flashes.
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf binutils-arm-linux-gnueabihf \
            libc6-dev-armhf-cross \
            build-essential bc bison flex libssl-dev u-boot-tools \
            cpio xz-utils lzop squashfs-tools device-tree-compiler \
            rsync wget openssl pkg-config

      # No flash dump needed: the blobs live in vendor/.
      - name: Fetch dependencies
        run: ./fetch-deps.sh

      # Each of these is staged by build-sdk.sh only if already built, so
      # skipping one silently produces an image missing that feature: no SSH
      # without dropbear, and no drone link at all without apfpv's
      # wpa_supplicant.
      - name: Build dropbear
        run: ./build-dropbear.sh

      - name: Build apfpv
        run: ./build-apfpv.sh

      - name: Build wfb-ng
        run: ./build-wfb.sh

      - name: Build the image
        run: ./build-sdk.sh

      - name: Package
        id: pkg
        run: |
          mkdir -p dist
          cp output/uImage-sdk dist/uImage-sdk
          (cd dist && sha256sum uImage-sdk > SHA256SUMS)
          {
            echo "commit=$GITHUB_SHA"
            echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "size=$(stat -c%s dist/uImage-sdk)"
            echo "md5=$(md5sum dist/uImage-sdk | cut -d' ' -f1)"
          } > dist/BUILDINFO
          cat dist/BUILDINFO
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The board fetches over a connection busybox wget cannot authenticate, so
      # the signature is what makes an image trustworthy rather than the
      # transport. Ed25519 over the image's raw SHA-256 digest, which is what
      # verify-sig on the board expects.
      #
      # Unsigned builds are still published: without the secret configured this
      # is a fork or a first run, and an image nobody can install is less useful
      # than one that needs -k. sysupgrade refuses unsigned images by default
      # either way, so the choice stays with whoever installs it.
      - name: Sign the image
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then
            echo "::warning::FIRMWARE_SIGNING_KEY is not set -- publishing unsigned"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$SIGNING_KEY" > /tmp/signing.key
          chmod 600 /tmp/signing.key
          sha256sum dist/uImage-sdk | cut -c1-64 | tr -d '\n' | xxd -r -p > /tmp/digest.bin
          [ "$(stat -c%s /tmp/digest.bin)" = "32" ]
          openssl pkeyutl -sign -rawin -inkey /tmp/signing.key \
            -in /tmp/digest.bin -out dist/uImage-sdk.sig
          shred -u /tmp/signing.key
          [ "$(stat -c%s dist/uImage-sdk.sig)" = "64" ]
          # Verify against the committed public key so a mismatched secret fails
          # here rather than on a board that can no longer be updated remotely.
          openssl pkey -pubin -inform DER -outform DER \
            -in <(printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; cat signing-key.pub) \
            -pubout > /tmp/pub.der
          openssl pkeyutl -verify -rawin -pubin -inkey /tmp/pub.der -keyform DER \
            -in /tmp/digest.bin -sigfile dist/uImage-sdk.sig
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # No private key ships in the image -- host keys are generated on the
      # board's first boot -- so this is safe to publish. Root's password is the
      # documented default; change it with ROOT_PASSWORD when building your own.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uImage-sdk-${{ steps.pkg.outputs.short }}
          path: dist/
          retention-days: 30

      # Publishes on every push to master and on manual runs (the job already
      # excludes pull requests). No cron: every dependency is pinned to a
      # commit or a version, so a nightly rebuild of unchanged inputs would
      # produce the same image. This repo changing is the only thing that can
      # change the output. Artifacts are zipped and need a token to fetch, so
      # the board cannot pull one; a release asset is the raw file on a stable
      # unauthenticated URL, which is what sysupgrade needs. The 'latest' tag is
      # recreated each time so that URL never changes.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest dist/uImage-sdk dist/SHA256SUMS dist/BUILDINFO \
            $([ -f dist/uImage-sdk.sig ] && echo dist/uImage-sdk.sig) \
            --title "latest (${{ steps.pkg.outputs.short }})" \
            --notes "Build of ${GITHUB_SHA}.

          Update an already-running board over SSH:

              sysupgrade https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/uImage-sdk

          Settings in /mnt/cfg are preserved. First-time flashing still needs
          TFTP from U-Boot -- see the README."
          echo "https://github.com/${GITHUB_REPOSITORY}/releases/download/latest/uImage-sdk"
